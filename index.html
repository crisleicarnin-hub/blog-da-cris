<head>

<title>Moda Viva</title>

<style>

body {
    margin:0;
    background:#fff9ec;
    font-family:"Work Sans", sans-serif;
    color:#13113d;
}

.hero {
    background:#2854ff;
    padding:60px 40px;
    display:grid;
    grid-template-columns:1fr 360px;
    gap:40px;
    align-items:center;
}

.hero h2 {
    color:#fff9ec;
    font-size:60px;
}

.imagem {
    width:360px;
    height:430px;
    border-radius:40px;
    overflow:hidden;
    border:3px solid #13113d;
    box-shadow:10px 10px 0 #ffd734;
}

.imagem img {
    width:100%;
    height:100%;
    object-fit:cover;
}

.faixa {
    background:#ffd734;
    padding:20px;
    text-align:center;
    font-weight:bold;
}

.card {
    background:white;
    border:2px solid #13113d;
    border-radius:30px;
    padding:30px;
}

#manifesto {
    background:#ff337c;
    color:white;
    padding:80px;
    text-align:center;
}

footer {
    background:#c8ff39;
    padding:40px;
}

</style>

</head>
